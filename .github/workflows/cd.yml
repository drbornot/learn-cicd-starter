name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"

      - name: Build
        run: ./scripts/buildprod.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/427655506653/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@notely-512616.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build Image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-512616/notely-ar-repo/notely:latest .